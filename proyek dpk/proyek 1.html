<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOPERASI SISWA SMKN 3 Jember</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* ==============================
   BACKGROUND IMAGE DI SINI
   Ganti "background.jpg" dengan
   nama file gambar kamu
============================== */
body {
    background-image: url('skaga.jpg'); /* <-- GANTI NAMA FILE GAMBAR */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Overlay transparan di atas background */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35); /* angka 0.35 = tingkat gelap overlay, ubah 0.0 - 1.0 */
    z-index: 0;
}

.wrapper {
    position: relative;
    z-index: 1;
    width: 95%;
    max-width: 1100px;
    background: rgba(255, 255, 255, 0.15); /* putih transparan */
    backdrop-filter: blur(12px);           /* efek kaca buram */
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    text-align: center;
}

/* ======= NAVBAR ======= */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: linear-gradient(90deg, #0577f2d9, rgb(131, 183, 243));
    color: white;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 0px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.menu {
    display: flex;
    gap: 25px;
}

.menu a {
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 15px;
    transition: opacity 0.2s;
}

.menu a:hover {
    opacity: 0.75;
}

/* ======= HERO ======= */
.hero {
    padding: 120px 40px;
    color: white;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 20px;
    line-height: 1.3;
}

.hero p {
    font-size: 20px;
    margin-bottom: 30px;
    color: rgba(255,255,255,0.9);
}

/* ======= BUTTON ======= */
.btn {
    padding: 15px 35px;
    border: none;
    border-radius: 30px;
    margin: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.btn-primary {
    background: rgb(131, 183, 243);
    color: white;
}

.btn-outline {
    background:  rgb(131, 183, 243);
    color: white;
    border: none;
}

/* ======= FOOTER ======= */
footer {
    padding: 20px;
    background: linear-gradient(90deg, #0577f2d9, rgb(131, 183, 243));
    color: white;
    font-size: 14px;
    border-top: 1px solid rgba(255,255,255,0.2);
}

.logo {
    text-align: left;
    margin-top: 0px;
}

.logo img {
    width: 120px;
    height: auto;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="navbar">

        <div class="logo">
    <img src="logo skaga.png" alt="Logo Sekolah">
        </div>
        <div class="logo">SMKN 3 JEMBER</div>
        <div class="menu">
            <a href="proyek 1.html">Beranda</a>
            <a href="tentang kops.html">Tentang Koperasi</a>
            <a href="produk kopsis.html">Produk</a>
            <a href="pengelola.html">Pengelola</a>
            <a href="kontak.html">Kontak</a>
        </div>
    </div>

    <div class="hero">
        <h1>Selamat Datang di Website Koperasi Siswa <br> SMKN 3 Jember</h1>
        <p>Melayani dengan sepenuh hati untuk kepentingan bersama</p>

        <button class="btn btn-primary" onclick="window.location.href='proyek 2.html'">
            Tujuan Web Dibuat
        </button>
        <button class="btn btn-outline" onclick="window.location.href='proyek 3.html'">
            Game Sederhana
        </button>
    </div>

    <footer>
        &copy; 2026 Koperasi Siswa SMKN 3 Jember | Website Resmi
    </footer>

</div>

</body>
</html>
